<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des étudiants</title>
    <style>
        :root {
            --color-page: #f5f7fa;
            --color-surface: #ffffff;
            --color-text: #1f2937;
            --color-muted: #6b7280;
            --color-border: #d1d5db;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-success: #15803d;
            --color-danger: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--color-page);
            color: var(--color-text);
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
        }

        section {
            margin-bottom: 24px;
            padding: 24px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
        }

        h1, h2 { margin-top: 0; }

        form {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 12px;
            align-items: end;
        }

        label { display: grid; gap: 6px; font-weight: bold; }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 4px;
            background: var(--color-primary);
            color: var(--color-surface);
            cursor: pointer;
        }

        button:hover { background: var(--color-primary-hover); }

        #message { min-height: 20px; color: var(--color-success); }
        #message.error { color: var(--color-danger); }

        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        .empty { color: var(--color-muted); }

        @media (max-width: 640px) {
            form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <section>
        <h1>Gestion des étudiants</h1>
        <p>Ajoutez puis consultez les étudiants enregistrés.</p>
        <form id="student-form">
            <label>
                Nom
                <input id="nom" name="nom" required>
            </label>
            <label>
                Prénom
                <input id="prenom" name="prenom" required>
            </label>
            <label>
                Date de naissance
                <input id="dateN" name="dateN" type="date" required>
            </label>
            <button type="submit">Ajouter un étudiant</button>
        </form>
        <p id="message" role="status"></p>
    </section>

    <section>
        <h2>Liste des étudiants</h2>
        <ul id="students"></ul>
    </section>
</main>
<script>
    const form = document.getElementById('student-form');
    const message = document.getElementById('message');
    const studentsList = document.getElementById('students');

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? 'error' : '';
    }

    function escapeHtml(value) {
        const element = document.createElement('div');
        element.textContent = value;
        return element.innerHTML;
    }

    async function loadStudents() {
        const response = await fetch('/api/students');
        if (!response.ok) {
            throw new Error('Impossible de charger les étudiants.');
        }

        const students = await response.json();
        studentsList.innerHTML = students.length
            ? students.map(student => `<li>${escapeHtml(student.nom)} ${escapeHtml(student.prenom)} — ${student.dateN}</li>`).join('')
            : '<li class="empty">Aucun étudiant enregistré.</li>';
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        showMessage('');

        const student = {
            nom: form.nom.value,
            prenom: form.prenom.value,
            dateN: form.dateN.value
        };

        try {
            const response = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });

            if (!response.ok) {
                throw new Error('Impossible d’ajouter l’étudiant.');
            }

            form.reset();
            showMessage('Étudiant ajouté.');
            await loadStudents();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    loadStudents().catch(error => showMessage(error.message, true));
</script>
</body>
</html>
