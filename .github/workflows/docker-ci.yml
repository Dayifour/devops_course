name: Docker CI

on:
  push:
  pull_request:

jobs:
  build-and-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configurer Java 17
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Compiler le jar (votre Dockerfile s'attend à trouver le code source, 
      # mais votre Dockerfile gère lui-même son build multi-stage, 
      # donc on pourrait même s'en passer si Docker fait tout).
      # Pour l'exemple avec le Dockerfile, Docker va tout faire tout seul.

      # 4. Exécuter explicitement docker build
      - name: Construire l'image Docker
        run: |
          docker build -t mon-app-java:latest .

      # 5. (Optionnel) Exécuter un docker run pour tester que l'image démarre bien
      - name: Tester le conteneur
        run: |
          docker run -d -p 8080:8080 --name test-container mon-app-java:latest
          # Attendre un peu que l'app démarre et vérifier les logs
          sleep 5
          docker logs test-container